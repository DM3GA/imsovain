[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "imsovain"
version = "0.1.0"
description = "Vanity OpenPGP v4 Ed25519 key generator"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Michael DM3GA", email = "dev@dm3ga.info" },
]
keywords = ["openpgp", "pgp", "ed25519", "vanity", "fingerprint"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "click>=8",
    "pynacl>=1.5",
]

[project.scripts]
imsovain = "imsovain.cli:main"

[tool.scikit-build]
minimum-version = "0.10"
wheel.packages = ["imsovain"]
build-dir = "build/{wheel_tag}"
