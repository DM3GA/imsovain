[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgpgen"
version = "0.1.0"
description = "Vanity OpenPGP v4 Ed25519 key generator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8",
    "pynacl>=1.5",
]

[project.optional-dependencies]
build = ["cmake>=3.16"]

[project.scripts]
pgpgen = "pgpgen.cli:main"

[tool.setuptools.packages.find]
include = ["pgpgen*"]
