[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "imsovain"
version = "0.1.0"
description = "Vanity OpenPGP v4 Ed25519 key generator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8",
    "pynacl>=1.5",
]

[project.scripts]
imsovain = "imsovain.cli:main"

[tool.scikit-build]
minimum-version = "0.10"
wheel.packages = ["imsovain"]
build-dir = "build/{wheel_tag}"
